<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mark Killer — video</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="studio.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Mark Killer &middot; video</p>
        <h1 id="title">Take the sparkle off</h1>
      </div>
      <p id="topline" class="tiny muted">Decoded, cleaned and re-encoded here. Nothing is uploaded.</p>
    </header>

    <section id="intake">
      <label id="drop" class="checker" for="picker" tabindex="0">
        <span class="drop-mark">&#10022;</span>
        <span class="drop-title">Drop a video</span>
        <span class="drop-hint tiny muted">or click to choose one &mdash; MP4, WebM, MOV</span>
        <input id="picker" type="file" accept="video/*" hidden />
      </label>
      <p id="intake-note" class="tiny muted note" hidden></p>
    </section>

    <section id="workspace" hidden>
      <div class="stage">
        <div class="frame checker">
          <canvas id="preview"></canvas>
          <figure class="closeup">
            <canvas id="zoom"></canvas>
            <figcaption class="eyebrow">the corner</figcaption>
          </figure>
        </div>

        <div class="stage-bar">
          <label class="toggle tiny"><input type="checkbox" id="show-original" /> show original</label>
          <label class="scrub tiny muted">frame
            <input type="range" id="time" min="0" max="100" value="10" />
          </label>
          <span id="meta" class="num tiny muted"></span>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-head">
          <h2>Where the mark is</h2>
          <button id="autofit" type="button" class="btn-quiet tiny">Find it again</button>
        </div>
        <p id="fit-note" class="tiny muted"></p>

        <label class="slider"><span>Strength</span><output id="gain-out" class="num"></output>
          <input type="range" id="gain" min="0.1" max="1" step="0.01" />
        </label>
        <label class="slider"><span>Left / right</span><output id="offsetX-out" class="num"></output>
          <input type="range" id="offsetX" min="-120" max="120" step="1" />
        </label>
        <label class="slider"><span>Up / down</span><output id="offsetY-out" class="num"></output>
          <input type="range" id="offsetY" min="-120" max="120" step="1" />
        </label>
        <label class="slider"><span>Size</span><output id="sizeScale-out" class="num"></output>
          <input type="range" id="sizeScale" min="0.4" max="2" step="0.01" />
        </label>

        <div class="actions">
          <button id="process" type="button" class="btn-mark">Clean the video</button>
          <button id="cancel" type="button" class="btn-quiet" hidden>Stop</button>
        </div>

        <div id="progress-wrap" hidden>
          <div class="bar"><div id="bar-fill"></div></div>
          <p id="progress-text" class="num tiny muted"></p>
        </div>

        <div id="result" hidden>
          <video id="result-video" controls playsinline></video>
          <button id="save" type="button" class="btn-mark">Save it</button>
          <p id="result-note" class="tiny muted"></p>
        </div>

        <p id="error" class="tiny error" hidden></p>
      </aside>
    </section>
  </div>

  <script type="module" src="studio.js"></script>
</body>
</html>
